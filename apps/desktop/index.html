<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaTag</title>
    <script>
      // plan/09 §4.2 — anti-flash boot; default is LIGHT when nothing stored (P02).
      (()=>{var s;var t;try{s=localStorage.getItem('pharmatag:theme');if(s==='dark'){t='dark'}else if(s==='light'){t='light'}else if(s==='system'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}else{t='light'}document.documentElement.setAttribute('data-theme',t);}catch(_e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
