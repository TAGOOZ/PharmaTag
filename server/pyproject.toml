[project]
name = "pharmatag-core"
version = "0.1.0"
description = "PharmaTag core server — FastAPI monolith (schema-first; ticket T01)"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "PyJWT>=2.8",
    "packaging>=23",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "uharfbuzz>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.alembic]
script_location = "alembic"